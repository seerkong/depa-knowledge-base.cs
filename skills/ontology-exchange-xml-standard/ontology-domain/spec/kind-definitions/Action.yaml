apiVersion: fs-native/v1
kind: KindDefinition
metadata:
  name: action
spec:
  resourceKind: Action
  sourceShapes: [manifest]
  descriptorSchema:
    rootElement: Action
    requiredAttributes: [fqn, id, ownerRef, portability]
    requiredChildren: [Description]
  identity:
    fqn: { from: "@fqn", required: true }
  entries:
    manifest:
      entry: Action.xml
  description: { path: Description, required: true, nonEmpty: true }
  internalContract:
    owns: [Mutation references, InternalLogic, Evidence references]
  crossResourceRules:
    - ownerRef-matches-containing-BusinessObject
    - composed-Mutations-share-the-same-BusinessObject-owner
  diagnostics:
    - code: ACTION_OWNER_MISMATCH
      message: Action ownerRef must match its containing BusinessObject.
