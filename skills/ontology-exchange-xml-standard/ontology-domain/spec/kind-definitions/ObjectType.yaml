apiVersion: fs-native/v1
kind: KindDefinition
metadata:
  name: object-type
spec:
  resourceKind: ObjectType
  sourceShapes: [manifest]
  entries:
    manifest:
      entry: ObjectType.xml
  descriptorSchema:
    rootElement: ObjectType
    requiredAttributes: [fqn, id]
    requiredChildren: [Description]
  identity:
    fqn: { from: "@fqn", required: true }
  description: { path: Description, required: true, nonEmpty: true }
  internalContract:
    owns: [Property, ComputedProperty, Mixin references, inheritance edge]
    forbidsUpperLayerRefs: true
  crossResourceRules:
    - object-type-ids-unique-across-type-system
    - properties-are-embedded-local-members-without-id-or-ref
    - property-paths-use-owner-fqn-hash-local-name
    - inheritance-graph-is-acyclic
    - child-properties-may-tighten-required-but-not-change-type-or-loosen-required
    - mixin-property-collisions-must-not-depend-on-application-order-because-current-cozo-om-storage-has-no-ordinal
  diagnostics:
    - code: OBJECT_TYPE_PROPERTY_OVERRIDE_INVALID
      message: A child ObjectType cannot change an inherited property type or loosen requiredness.
    - code: COZO_OM_MIXIN_PROPERTY_AMBIGUOUS
      message: Applied Mixins cannot contribute incompatible definitions for the same Property because current cozo-om storage does not persist application order.
