apiVersion: fs-native/v1
kind: KindDefinition
metadata:
  name: business-object
spec:
  resourceKind: BusinessObject
  sourceShapes:
    - manifest
  descriptorSchema:
    rootElement: BusinessObject
    requiredAttributes:
      - fqn
      - id
    requiredChildren:
      - Description
      - Purpose
    allowedCatalogs:
      - ManifestResourceCatalog
  identity:
    fqn:
      from: "@fqn"
      required: true
  description:
    path: Description
    required: true
    nonEmpty: true
  entries:
    manifest:
      entry: BusinessObject.xml
  internalContract:
    ownsCatalogKinds:
      - Operation
      - Mutation
      - Interceptor
      - ComputedFunction
      - ConstraintHandler
      - Lifecycle
    declaresClass: true
    directLocalMembers:
      - Identity.Field
      - Fields.Field
      - ComputedProps.ComputedProp
    supports:
      - parentRef
      - Mixins
  crossResourceRules:
    - parentRef-resolves-to-entity-Class-or-BusinessObject
    - no-Field-ref-inside-BusinessObject
    - member-ownerRef-matches-containing-BusinessObject
    - property-roles-apply-only-to-BusinessObject-local-Fields
  diagnostics:
    - code: BUSINESS_OBJECT_PROPERTY_REF_REJECTED
      message: BusinessObject must declare Field facts directly; Field@ref is not allowed.
    - code: BUSINESS_OBJECT_MEMBER_OWNER_MISMATCH
      message: A local member resource must be owned by the containing BusinessObject manifest.
