apiVersion: fs-native/v1
kind: KindDefinition
metadata:
  name: class
spec:
  resourceKind: Class
  sourceShapes: [manifest]
  entries:
    manifest:
      entry: Class.xml
  descriptorSchema:
    rootElement: Class
    requiredAttributes: [fqn, id]
    requiredChildren: [Description]
  identity:
    fqn: { from: "@fqn", required: true }
  description: { path: Description, required: true, nonEmpty: true }
  internalContract:
    owns: [Field, ComputedProp, Mixin references, inheritance edge]
    forbidsUpperLayerRefs: true
  crossResourceRules:
    - class-ids-unique-across-type-system
    - fields-are-embedded-local-members-without-id-or-ref
    - field-paths-use-owner-fqn-hash-local-name
    - inheritance-graph-is-acyclic
    - child-fields-may-tighten-required-but-not-change-type-or-loosen-required
    - mixin-field-collisions-must-not-depend-on-application-order-because-current-cozo-om-storage-has-no-ordinal
  diagnostics:
    - code: CLASS_FIELD_OVERRIDE_INVALID
      message: A child Class cannot change an inherited field type or loosen requiredness.
    - code: COZO_OM_MIXIN_PROPERTY_AMBIGUOUS
      message: Applied Mixins cannot contribute incompatible definitions for the same Field because current cozo-om storage does not persist application order.
