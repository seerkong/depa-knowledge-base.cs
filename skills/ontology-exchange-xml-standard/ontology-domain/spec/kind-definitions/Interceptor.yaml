apiVersion: fs-native/v1
kind: KindDefinition
metadata:
  name: interceptor
spec:
  resourceKind: Interceptor
  sourceShapes: [manifest]
  descriptorSchema:
    rootElement: Interceptor
    requiredAttributes: [fqn, id, ownerRef, operationRef, phase, seq, portability]
    requiredChildren: [Description]
  identity:
    fqn: { from: "@fqn", required: true }
  entries:
    manifest:
      entry: Interceptor.xml
  description: { path: Description, required: true, nonEmpty: true }
  crossResourceRules:
    - ownerRef-matches-containing-BusinessObject
    - operationRef-resolves-to-same-owner-Operation
    - phase-is-before-or-after
  diagnostics:
    - code: INTERCEPTOR_TARGET_INVALID
      message: Interceptor must target an Operation owned by the same BusinessObject.
